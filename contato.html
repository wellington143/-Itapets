<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Ita Pets</title>
</head>

<body>

    <header>
        <h1>Ita Pets</h1>
        <p>Produtos para cuidar do seu pet!</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="index.html#produtos">Produtos</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
    </nav>

    <main>

        <section>

            <h2>Envie seu comentário</h2>

            <form action="mailto:wellingtonrx100@gmail.com" method="post" enctype="text/plain">

                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" required><br><br>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="telefone">Telefone:</label><br>
                <input type="tel" id="telefone" name="telefone"><br><br>

                <p>Qual é o seu tipo de pet?</p>

                <input type="radio" id="cachorro" name="pet" value="cachorro">
                <label for="cachorro">Cachorro</label><br>

                <input type="radio" id="gato" name="pet" value="gato">
                <label for="gato">Gato</label><br>

                <input type="radio" id="outro" name="pet" value="outro">
                <label for="outro">Outro</label><br><br>

                <p>Qual assunto deseja tratar?</p>

                <input type="checkbox" id="produto" name="assunto" value="produto">
                <label for="produto">Produtos</label><br>

                <input type="checkbox" id="duvida" name="assunto" value="duvida">
                <label for="duvida">Dúvida</label><br>

                <input type="checkbox" id="sugestao" name="assunto" value="sugestao">
                <label for="sugestao">Sugestão</label><br><br>

                <label for="comentario">Comentário:</label><br>
                <textarea id="comentario" name="comentario" rows="5" cols="50"></textarea><br><br>

                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Ita Pets. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
