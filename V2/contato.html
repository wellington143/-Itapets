<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Contato - Ita Pets</title>
  </head>

  <body>
    <header>
      <h1>Ita Pets</h1>
      <p>Produtos para cuidar do seu pet!</p>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="index.html#produtos">Produtos</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>

    <main>
      <h2>Envie seu comentário</h2>

      <form
        action="mailto:wellingtonrx100@gmail.com"
        method="post"
        enctype="text/plain"
      >
        <label for="nome" class="full-width">Nome:</label>
        <input type="text" id="nome" name="nome" required class="full-width" />

        <label for="email" class="full-width">E-mail:</label>
        <input type="email" id="email" name="email" required class="full-width" />

        <label for="telefone" class="full-width">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" class="full-width" />

        <p class="full-width titulo-grupo">Qual é o seu tipo de pet?</p>

        <input type="radio" id="cachorro" name="pet" value="cachorro" class="inline-input" />
        <label for="cachorro" class="inline-label">Cachorro</label>

        <input type="radio" id="gato" name="pet" value="gato" class="inline-input" />
        <label for="gato" class="inline-label">Gato</label>

        <input type="radio" id="outro" name="pet" value="outro" class="inline-input" />
        <label for="outro" class="inline-label">Outro</label>

        <p class="full-width titulo-grupo">Qual assunto deseja tratar?</p>

        <input type="checkbox" id="produto" name="assunto" value="produto" class="inline-input" />
        <label for="produto" class="inline-label">Produtos</label>

        <input type="checkbox" id="duvida" name="assunto" value="duvida" class="inline-input" />
        <label for="duvida" class="inline-label">Dúvida</label>

        <input type="checkbox" id="sugestao" name="assunto" value="sugestao" class="inline-input" />
        <label for="sugestao" class="inline-label">Sugestão</label>

        <label for="comentario" class="full-width">Comentário:</label>
        <textarea
          id="comentario"
          name="comentario"
          rows="5"
          cols="50"
          class="full-width"
        ></textarea>

        <input type="submit" value="Enviar" class="btn-grid btn-enviar" />
        <input type="reset" value="Limpar" class="btn-grid btn-limpar" />
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Ita Pets. Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
